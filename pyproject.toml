[project]
name = "tourism-system"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "argon2-cffi>=25.1.0",
    "bcrypt>=4.0.1",
    "chromadb>=1.0.20",
    "cryptography>=46.0.3",
    "fastapi>=0.128.0",
    "langchain>=0.3.27",
    "langchain-chroma>=1.1.0",
    "langchain-core>=0.3.80",
    "langchain-openai>=0.3.35",
    "langgraph>=0.2.0",
    "loguru>=0.7.3",
    "openai>=2.15.0",
    "openpyxl>=3.1.0",
    "osmnx>=2.0.7",
    "passlib[bcrypt]>=1.7.4",
    "pyexecjs>=1.5.1",
    "pyjwt>=2.10.1",
    "psycopg[binary]>=3.1.18",
    "python-dotenv>=1.2.1",
    "python-multipart>=0.0.21",
    "requests>=2.32.5",
    "retry>=0.9.2",
    "rich>=14.2.0",
    "sqlmodel>=0.0.31",
    "tavily-python>=0.7.19",
    "thefuzz>=0.22.1",
    "uvicorn>=0.40.0",
    "alembic>=1.18.4",
    "pytest>=9.0.3",
]

[tool.pytest.ini_options]
pythonpath = ["src", "tools"]
testpaths = ["tests"]
python_files = [
    "test_agent.py",
    "test_xhs_download_save.py",
    "test_data_length.py",
    "test_script_entrypoints.py",
]
filterwarnings = [
    "ignore:The default datetime adapter is deprecated:DeprecationWarning",
]
